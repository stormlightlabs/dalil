# Posts a comment on a pull request as stormlight-thunderbot. Agent sessions
# never hold the App's key, so they post through this workflow instead of with
# their own GitHub access, which would show the comment as the person whose
# account the session uses:
#
#   gh workflow run comment.yml -f pr=<n> -f body="$(cat comment.md)"
#
# or, through the GitHub MCP tools, actions_run_trigger with method
# run_workflow, workflow_id comment.yml, ref main and the same inputs.
#
# With `section`, such as `-f section="Squash message"`, the body becomes that
# section of the bot's status comment on the pull request instead of a new
# comment: `fab pr-status` posts the status comment once and edits it after,
# and an edit sends the owner no notification.
#
# With `review`, the full SHA of the head a review pass read, the body is
# that pass's report and posts as one review: `fab pr-review` puts each
# finding whose `<path>:<line>` falls in the diff on that line, and the rest
# of the report in the review's body.
#
# With `answers` set to `true`, the body is a revise pass's answers, a line
# `<comment id> · <outcome>` per finding: `fab pr-answer` posts them as
# replies on the findings' threads in one review, then resolves each thread
# whose outcome starts with `Fixed` or `Deferred`.
name: Bot comment

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      body:
        description: Comment text, in Markdown
        required: true
      section:
        description: A status comment section to set instead of posting a comment
        required: false
        default: ""
      review:
        description: The head SHA a review pass read, to post the body as a review with its findings on the diff
        required: false
        default: ""
      answers:
        description: true to post the body as answers on the findings' review threads
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      - name: Check the pull request
        env:
          PR: ${{ inputs.pr }}
          BODY: ${{ inputs.body }}
          SECTION: ${{ inputs.section }}
          REVIEW: ${{ inputs.review }}
          ANSWERS: ${{ inputs.answers }}
        run: |
          if [[ ! $PR =~ ^[0-9]+$ ]]; then
            echo "::error title=pr::'$PR' is not a pull request number."
            exit 1
          fi
          modes=0
          [[ -n $SECTION ]] && modes=$((modes + 1))
          [[ -n $REVIEW ]] && modes=$((modes + 1))
          [[ $ANSWERS == true ]] && modes=$((modes + 1))
          if ((modes > 1)); then
            echo "::error title=mode::Set at most one of section, review and answers."
            exit 1
          fi
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.md"

      # A section, a review and answers need fab, from the default branch as
      # the Review gate takes it, whatever ref the run was dispatched on.
      - uses: actions/checkout@v5
        if: inputs.section != '' || inputs.review != '' || inputs.answers == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/fab
        if: inputs.section != '' || inputs.review != '' || inputs.answers == 'true'
        with:
          command: ${{ inputs.review != '' && 'pr-review' || inputs.answers == 'true' && 'pr-answer' || 'pr-status' }}

      - name: Post the comment
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SECTION: ${{ inputs.section }}
          HEAD_SHA: ${{ inputs.review }}
          ANSWERS: ${{ inputs.answers }}
        run: |
          if [[ -n $SECTION ]]; then
            fab pr-status --body-file "$RUNNER_TEMP/body.md"
          elif [[ -n $HEAD_SHA ]]; then
            fab pr-review --body-file "$RUNNER_TEMP/body.md"
          elif [[ $ANSWERS == true ]]; then
            fab pr-answer --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          fi
