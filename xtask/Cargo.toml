[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.0"
clap_mangen = "0.3.0"
dalil = { path = "../crates/dalil-cli" }
gix = { version = "0.85.0", default-features = false, features = ["revision", "mailmap", "sha1"] }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
unicode-normalization = "0.1.25"
