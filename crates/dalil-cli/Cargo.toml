[package]
name = "dalil"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only, evidence-backed repository orientation for people and coding agents"
license = "MIT"
repository = "https://github.com/stormlightlabs/dalil"
readme = "../../README.md"
keywords = ["cli", "git", "repository", "code-analysis", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["../../.sandbox/**"]

[dependencies]
anyhow = "1"
dalil-core = { version = "0.1.0", path = "../dalil-core" }
clap = { version = "4.6.2", features = ["derive"] }
libc = "0.2"
minijinja = { version = "2.21.0", default-features = false, features = ["builtins", "serde", "urlencode"] }
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"

[dev-dependencies]
gix = { version = "0.85.0", default-features = false, features = ["revision", "mailmap", "sha1"] }
